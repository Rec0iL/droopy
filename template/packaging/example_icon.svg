<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="0.55" stop-color="#6c9cff"/>
      <stop offset="1" stop-color="#8f82ff"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6efff"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M48 60 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
    <path d="M208 48 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M214 200 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.7"/>
  </g>
  <!-- the .exe window the icon pops out of -->
  <rect x="44" y="104" width="168" height="112" rx="22" fill="url(#win)"/>
  <rect x="44" y="104" width="168" height="22" rx="11" fill="#cfdcff"/>
  <circle cx="62" cy="115" r="4.5" fill="#ff8a9b"/>
  <circle cx="76" cy="115" r="4.5" fill="#ffd36e"/>
  <circle cx="90" cy="115" r="4.5" fill="#5fe3bf"/>
  <!-- face -->
  <g fill="#1f3a66">
    <ellipse cx="102" cy="176" rx="7" ry="9"/>
    <ellipse cx="154" cy="176" rx="7" ry="9"/>
  </g>
  <g fill="#ffffff"><circle cx="104.5" cy="172.5" r="2.6"/><circle cx="156.5" cy="172.5" r="2.6"/></g>
  <path d="M116 186 q12 12 24 0" fill="none" stroke="#1f3a66" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="86" cy="190" rx="10" ry="6" fill="#ff9ab3" opacity="0.65"/>
  <ellipse cx="170" cy="190" rx="10" ry="6" fill="#ff9ab3" opacity="0.65"/>
  <!-- extracted icon flying out -->
  <g transform="rotate(-10 128 76)">
    <rect x="94" y="42" width="68" height="68" rx="16" fill="#ffffff" opacity="0.95"/>
    <path d="M128 54 l8.5 18 19.5 2.5 -14.5 13.5 4 19.5 -17.5 -10 -17.5 10 4 -19.5 -14.5 -13.5 19.5 -2.5z"
          fill="url(#star)"/>
  </g>
  <!-- motion arrows -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M70 92 l-10 -14"/><path d="M186 92 l10 -14"/>
  </g>
</svg>
